<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Zeitreise Cádiz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: Lesedokument für eine Person. Oben Zeitstrahl und Umschalter für beide Altersstufen, darunter ein Block je Volk mit gleichem Raster. */
:root {
  --bg: #EDF2F4;
  --surface: #FFFFFF;
  --ink: #0C2233;
  --muted: #4E6376;
  --line: #CBD8E0;
  --tint: #DCEAF0;
  --sea: #0F6E8C;
  --on-sea: #FFFFFF;
  --sun: #F0B02E;
  --on-sun: #2A1D00;
  --henry: #B8561A;
  --nick: #0F6E8C;
  --nogo: #F3C9C0;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1B27; --surface: #102636; --ink: #E7F0F5; --muted: #9DB3C2; --line: #234055;
    --tint: #16303F; --sea: #4FB3D3; --on-sea: #06202D; --sun: #F2BC4B; --on-sun: #2A1D00;
    --henry: #F0A06A; --nick: #6CC3DF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1B27; --surface: #102636; --ink: #E7F0F5; --muted: #9DB3C2; --line: #234055;
  --tint: #16303F; --sea: #4FB3D3; --on-sea: #06202D; --sun: #F2BC4B; --on-sun: #2A1D00;
  --henry: #F0A06A; --nick: #6CC3DF;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.12; margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--sea); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

.wrap {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.hero { padding-block: 28px 8px; display: flex; flex-direction: column; gap: 8px; }
.eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--sea); }
.hero h1 { font-size: clamp(2.1rem, 8.5vw, 3rem); font-weight: 800; }
.hero p { color: var(--muted); max-width: 52ch; }

.modebar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--tint); border-radius: 12px; padding: 4px; }
.seg button { border: 0; background: transparent; border-radius: 9px; min-height: 44px; font-weight: 700; cursor: pointer; padding: 6px 8px; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.18); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h2 { font-size: 1.5rem; font-weight: 800; }
.sec-t { font-size: 1.35rem; font-weight: 800; margin-top: 12px; }

.era { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.era a { display: grid; grid-template-columns: 7.5rem 1fr; gap: 4px 12px; text-decoration: none; color: var(--ink); padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; align-items: baseline; }
.era b { font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; }
.era .y { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; grid-column: 1; }
.era .s { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
@media (max-width: 420px) { .era a { grid-template-columns: 1fr; } .era .s { grid-column: 1; grid-row: auto; } }

.when { align-self: flex-start; background: var(--sun); color: var(--on-sun); border-radius: 999px; padding: 3px 12px; font-weight: 700; font-size: .92rem; }
.row { display: flex; flex-direction: column; gap: 6px; padding-top: 12px; border-top: 1px solid var(--line); }
.lab { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.t { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.t p { flex: 1; min-width: 0; }
.who { flex: none; width: 3.9rem; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.who { overflow-wrap: anywhere; }
.names { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 6px; }
.nm { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; color: var(--muted); min-width: 0; }
.inp { background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 48px; min-width: 0; width: 100%; color: var(--ink); }
.t.h .who { color: var(--henry); }
.t.n .who { color: var(--nick); }
#app[data-mode="h"] .t.n, #app[data-mode="n"] .t.h { display: none; }
#app[data-mode="h"] .who, #app[data-mode="n"] .who { display: none; }

.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 680px; font-size: .95rem; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td:first-child { font-weight: 700; }

.ideas { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
.note { color: var(--muted); font-size: .92rem; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --nogo: #5A2A24; } }
:root[data-theme="dark"] { --nogo: #5A2A24; }
.pols { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.polfig { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; text-align: center; }
.polfig figcaption { display: flex; flex-direction: column; font-size: .9rem; }
.polfig figcaption span { color: var(--muted); }
.pol { width: 100%; max-width: 130px; height: auto; }
.pol circle { fill: none; stroke: var(--line); stroke-width: 1.5; }
.pol .ng { fill: var(--nogo); stroke: none; }
.pol line { stroke: var(--ink); stroke-width: 1.5; }
.pol polygon { fill: var(--ink); }
.pol text { fill: var(--ink); font-size: 11px; font-family: var(--font-body); }
.back { display: inline-block; margin-top: 4px; font-weight: 700; }
</style>

</head>
<body>
<div id="app" class="wrap" data-mode="both">
  <header class="hero">
    <div class="eyebrow">Vorbereitung Cádiz-Rallye</div>
    <h1>Zeitreise Cádiz</h1>
    <p>Wer hat die Stadt in 3000 Jahren besetzt, wie haben die Menschen dort gelebt und was konnten sie besonders gut? Jeder Abschnitt hat eine Version für das jüngere Kind (7 Jahre) und das ältere Kind (10 Jahre). Die Namen sind freiwillig.</p>
    <div class="names"><label class="nm"><span>Name, 10 Jahre</span><input class="inp" id="name-n" type="text" maxlength="20" autocomplete="off" placeholder="Kind 1"></label><label class="nm"><span>Name, 7 Jahre</span><input class="inp" id="name-h" type="text" maxlength="20" autocomplete="off" placeholder="Kind 2"></label></div>
  </header>
  <div class="modebar"><div class="seg" role="group" aria-label="Version wählen">
    <button type="button" data-mode="both" aria-pressed="true">Beide</button>
    <button type="button" data-mode="h" aria-pressed="false"><span data-name="h"></span> (7)</button>
    <button type="button" data-mode="n" aria-pressed="false"><span data-name="n"></span> (10)</button>
  </div></div>
  <div class="stack" id="content"></div>
</div>
